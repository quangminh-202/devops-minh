version: '3.8'

services:
  catty-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catty-reminders
    ports:
      - "8182:8181"
    volumes:
      # Mount thư mục code để có thể edit code và reload (development mode)
      - ./catty-reminders-app:/app
      # Volume riêng cho database để persist data
      - catty-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8181')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  catty-data:
    driver: local

networks:
  catty-network:
    driver: bridge

