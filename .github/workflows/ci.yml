name: CI - Run All Tests

on:
  push:
    branches:
      - main
      - github-action
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd catty-reminders-app 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright fastapi uvicorn jinja2

      - name: Install browsers (for UI tests)
        run: |
          python -m playwright install chromium
      
      - name: Start FastAPI app      
        run: |      
          cd catty-reminders-app      
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 &      
          sleep 5  
      
      - name: Run all tests
        run: |
          cd catty-reminders-app
          echo "Running all test suites..."
          python3 -m pytest -v --browser chromium tests || exit 1

      - name: Run individual test types (for clarity)
        run: |
          cd catty-reminders-app
          echo "Running Unit Tests"
          python3 -m pytest -v tests/test_unit.py || echo "Unit tests failed"
          echo "Running API Tests"
          python3 -m pytest -v tests/test_api.py || echo "API tests failed"
          echo "Running UI Tests"
          python3 -m pytest -s -v --browser chromium tests/test_ui.py || echo "UI tests failed"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{github.repository}} 

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: True
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
