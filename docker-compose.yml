services:
  catty-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catty-reminders
    ports:
      - "8182:8181"
    volumes:
      # Mount code directory for live editing and reload (development mode)
      - ./catty-reminders-app:/app
      # Separate volume for database to persist data
      - catty-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "python", "- <<'PY'\nimport sys\nfrom urllib.request import urlopen\ntry:\n    with urlopen('http://localhost:8181', timeout=5) as r:\n        sys.exit(0 if 200 <= r.status < 400 else 1)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  catty-data:
    driver: local

networks:
  catty-network:
    driver: bridge

