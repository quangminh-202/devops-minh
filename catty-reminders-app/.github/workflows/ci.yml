name: CI - Python Pytest and Playwright

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest   # Run on a GitHub-hosted Ubuntu environment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Specify the Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Show test configuration
        run: cat inputs.json || echo "inputs.json not found, skipping"

      - name: Start application
        run: |
          nohup python app.py &
          sleep 5

      - name: Run all tests
        run: python -m pytest -v --browser chromium tests
