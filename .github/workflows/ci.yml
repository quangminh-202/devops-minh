name: CI - Run All Tests

on:
  push:
    branches:
      - main
      - github-action
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright

      - name: Install browsers (for UI tests)
        run: |
          python -m playwright install chromium

      - name: Run all tests
        run: |
          cd catty-reminders-app
          echo "Running all test suites..."
          python3 -m pytest -v --browser chromium tests || exit 1

      - name: Run individual test types (for clarity)
        run: |
          cd catty-reminders-app
          echo "Running Unit Tests"
          python3 -m pytest -v tests/test_unit.py || echo "Unit tests failed"
          echo "Running API Tests"
          python3 -m pytest -v tests/test_api.py || echo "API tests failed"
          echo "Running UI Tests"
          python3 -m pytest -s -v --browser chromium tests/test_ui.py || echo "UI tests failed"
