name: CD - Deploy via Docker

on:
  push:
    branches:
      - main
      - docker
      - docker-compose

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Docker container on remote host
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{secrets.SSH_HOST}}
          port: ${{secrets.SSH_PORT}}
          username: ${{secrets.SSH_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          debug: true
          timeout: 600s
          command_timeout: 1800s
          sync: true
          script_stop: false
          script: |
            set -e

            echo "==> Go to project folder on server"
            cd ~/devops-minh

            echo "==> Pull latest code from branch ${{ github.ref_name }}"
            git pull origin ${{ github.ref_name }}

            echo "==> Login to GHCR"
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Pull images defined in docker-compose.yml"
            docker compose pull

            echo "==> Start stack with Docker Compose"
            # docker compose down || true
            docker compose up -d --remove-orphans

            echo "==> Check app health on port 8181"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8181/ > /dev/null 2>&1; then
                echo "App is UP"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 2
            done

            echo "App did not become healthy in time"
            echo "Logs from app service:"
            docker compose logs app || true
            exit 1
